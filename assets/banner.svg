<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180">
  <defs>
    <!-- Background Gradient matching App Dark Theme #080c16 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Logo Gradient matching App Header: 135deg from #6366f1 to #06b6d4 -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing Drop Shadow for Logo -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.4)" />
      <stop offset="50%" stop-color="rgba(6, 182, 212, 0.2)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', Roboto, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.02em;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
    }
    .tag {
      font-family: 'JetBrains Mono', monospace, Consolas;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
    }
  </style>

  <!-- Banner Container -->
  <rect x="2" y="2" width="876" height="176" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Logo Badge Group -->
  <g transform="translate(40, 40)">
    <!-- Rounded Rectangle Badge matching App UI -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#logoGrad)" filter="url(#logoGlow)" />
    <rect x="0" y="0" width="100" height="100" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" />

    <!-- Lucide Crown Icon centered in 100x100 badge (24x24 scaled 2.5x -> 60x60, offset (100-60)/2 = 20) -->
    <g transform="translate(20, 20) scale(2.5)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" fill="rgba(255, 255, 255, 0.2)" />
      <path d="M5 21h14" />
    </g>
  </g>

  <!-- Typography & Description -->
  <g transform="translate(170, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="42" width="168" height="24" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="12" y="58" class="tag">NEURO-SYMBOLIC AI</text>

    <!-- Main Title -->
    <text x="0" y="98" class="title">Deep Learning N-Queens Solver</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="128" class="subtitle">Fully Convolutional Policy &amp; Value Network (FCN-PV) with AI-Guided Search Recovery</text>
  </g>
</svg>

