<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient matching App UI Header -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Outer Ambient Glow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>

    <!-- Subtle Crown Inner Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Glowing Shadow & Badge Rectangle -->
  <rect x="14" y="14" width="100" height="100" rx="26" fill="url(#headerGrad)" filter="url(#badgeGlow)" />
  
  <!-- Subtle Glass Border Highlight -->
  <rect x="14" y="14" width="100" height="100" rx="26" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2" />

  <!-- Lucide Crown Icon centered (scaled from 24x24 viewBox to fit 128x128) -->
  <!-- Center is at (64, 64), 24x24 scaled 3x = 72x72, offset: (64 - 36) = 28 -->
  <g transform="translate(28, 28) scale(3)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" fill="url(#crownGrad)" fill-opacity="0.2" />
    <path d="M5 21h14" />
  </g>
</svg>

